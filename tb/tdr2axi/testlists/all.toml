[[tests]]
name = "tdr2axi_sba_error_address_test"
reseed = 5
expect_fail = true
expect_fail_match = 'CHK-SBA-NO-INC-AFTER-ERROR FAIL: sbaddress advanced after a failed access: 0x[0-9a-f]+, one access past the failing address 0x[0-9a-f]+, after '
expect_fail_allow = [
  'CHK-SBA-NO-INC-AFTER-ERROR FAIL: DM answer to READ 0x39 data 0x00000000: response 0 data 0x[0-9a-f]{8}, predicted 0x[0-9a-f]+ on mask 0xffffffff',
  'CHK-TDR-CAPTURE-EDGE FAIL: o_dmi_tdr 0x[0-9a-f]+ at capture, predicted TdrCaptureExpect\(addr=57, data=TdrField\(allowed=\([0-9]+,\), mask=4294967295\), status=<TdrStatus\.SUCCESS: 0>',
]

