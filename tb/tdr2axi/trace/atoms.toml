[[atom]]
id = "S-TDR2AXI-0007"
kind = "normative"
status = "current"
text = "`dmi_tdr_bridge` is the DMI part of `dmi_jtag` and `dmi_cdc`, kept rule for rule: the same state machine, sticky busy and failed status, and read-data markers."
