[[atom]]
id = "S-TDR2AXI-0001"
kind = "normative"
status = "current"
text = "`tdr2axi` gives a JTAG debugger access to an AXI4 or AXI4-Lite bus through a single 41-bit test data register (TDR) of an existing TAP or IEEE 1687 (IJTAG) network."
source = "spec"
anchor = "tdr2axi-tdr-to-axi-through-the-system-bus-access"
section = "tdr2axi: TDR to AXI through the System Bus Access"
line = 8
classified = "model"
hash = "71535400dccd"
terms = ["TDR"]
refs = ["AXI4", "AXI4-Lite", "IEEE 1687"]
quantities = ["41-bit TDR"]

[[atom]]
id = "S-TDR2AXI-0002"
kind = "normative"
status = "current"
text = "Behind the TDR it reuses this repository's Debug Module registers (`dm_csrs`) and System Bus Access engine (`dm_sba`), so the debugger drives it with the standard RISC-V debug DMI protocol: OpenOCD and other RISC-V debuggers reach memory through `sbcs`, `sbaddress*` and `sbdata*` without any custom tooling."
source = "spec"
anchor = "tdr2axi-tdr-to-axi-through-the-system-bus-access"
section = "tdr2axi: TDR to AXI through the System Bus Access"
line = 10
classified = "model"
hash = "4717e71a44f3"
flags = ["missing-value"]
terms = ["dm_csrs", "dm_sba", "sbcs", "sbaddress*", "sbdata*"]
refs = ["RISC-V Debug Specification"]

[[atom]]
id = "S-TDR2AXI-0003"
kind = "informative"
status = "current"
text = "It is meant for systems that already own a TAP, for example a DFT or IJTAG network, and want bus access without a second TAP or a core-side debug module."
source = "spec"
anchor = "tdr2axi-tdr-to-axi-through-the-system-bus-access"
section = "tdr2axi: TDR to AXI through the System Bus Access"
line = 15
classified = "model"
hash = "111697625a06"

[[atom]]
id = "S-TDR2AXI-0004"
kind = "normative"
status = "current"
text = "The sources are in `src/tdr2axi/` and are compiled with the Bender target `tdr2axi`."
source = "spec"
