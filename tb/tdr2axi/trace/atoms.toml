[[atom]]
id = "S-TDR2AXI-0088"
kind = "normative"
status = "current"
text = "dmi_tdr_bridge is in the TCK domain; dm_csrs, dm_sba and the AXI adapter are in the i_clk domain; two cdc_2phase_clearable instances carry dmi_req_t from TCK to i_clk and dmi_resp_t from i_clk to TCK."
source = "spec"
