schema_version = 1
dut = "tdr2axi"

[[dimension]]
id = "CFG-AXI-ADDR-WIDTH"
kind = "parameter"
values = ["2", "3", "32", "48", "64"]
default = "64"
build = true
signals = ["AXI_ADDR_WIDTH"]
atoms = ["S-TDR2AXI-0014", "S-TDR2AXI-0021", "S-TDR2AXI-0022", "S-TDR2AXI-0023", "S-TDR2AXI-0067"]
atom_hashes = { S-TDR2AXI-0014 = "b0d1597d458b", S-TDR2AXI-0021 = "8b0b7649cf7d", S-TDR2AXI-0022 = "eee9256a3469", S-TDR2AXI-0023 = "0c4dd0b88aa6", S-TDR2AXI-0067 = "7da09cf58456" }

[[dimension]]
id = "CFG-AXI-CACHE"
kind = "parameter"
values = ["4'b0000", "4'b1111"]
default = "4'b0000"
build = true
signals = ["AXI_CACHE"]
atoms = ["S-TDR2AXI-0017", "S-TDR2AXI-0058"]
atom_hashes = { S-TDR2AXI-0017 = "8462fa5a51c6", S-TDR2AXI-0058 = "b5989e954e15" }

[[dimension]]
id = "CFG-AXI-DATA-WIDTH"
kind = "parameter"
values = ["32", "64"]
default = "64"
build = true
signals = ["AXI_DATA_WIDTH", "axi_req_t", "axi_rsp_t"]
