atom_hashes = { S-TDR2AXI-0015 = "3abbe99ca471", S-TDR2AXI-0019 = "068760d94671", S-TDR2AXI-0020 = "039ce450baa2", S-TDR2AXI-0022 = "eee9256a3469" }

[[dimension]]
id = "CFG-AXI-PROT"
kind = "parameter"
values = ["3'b010", "3'b101"]
default = "3'b010"
build = true
signals = ["AXI_PROT"]
atoms = ["S-TDR2AXI-0016", "S-TDR2AXI-0058"]
atom_hashes = { S-TDR2AXI-0016 = "18fce41befde", S-TDR2AXI-0058 = "b5989e954e15" }

[[dimension]]
id = "CFG-CLK-RATIO"
kind = "clock-ratio"
values = ["20:1", "20:19", "20:21", "1:2", "1:20"]
default = "20:1"
build = false
signals = ["i_clk", "i_tck"]
atoms = ["S-TDR2AXI-0048"]
atom_hashes = { S-TDR2AXI-0048 = "719d2a15043e" }

[[dimension]]
id = "CFG-SYNC-STAGES"
kind = "parameter"
values = ["3", "4"]
default = "3"
build = true
signals = ["SYNC_STAGES"]
atoms = ["S-TDR2AXI-0018", "S-TDR2AXI-0053"]
atom_hashes = { S-TDR2AXI-0018 = "d0a75c21b626", S-TDR2AXI-0053 = "d81fd3f0d3cd" }

[[dimension]]
id = "CFG-TEST-MODE"
kind = "mode"
values = ["0", "1"]
default = "0"
build = false
signals = ["i_test_mode"]
atoms = ["S-TDR2AXI-0027", "S-TDR2AXI-0028", "S-TDR2AXI-0052"]
atom_hashes = { S-TDR2AXI-0027 = "0c229dcac2ea", S-TDR2AXI-0028 = "2ce7ed98a2b9", S-TDR2AXI-0052 = "a2c835cc4ea4" }

[[dimension]]
id = "CFG-USE-AXI-LITE"
kind = "parameter"
values = ["0", "1"]
default = "0"
build = true
signals = ["USE_AXI_LITE", "axi_req_t", "axi_rsp_t"]
atoms = ["S-TDR2AXI-0013", "S-TDR2AXI-0019", "S-TDR2AXI-0020", "S-TDR2AXI-0024"]
atom_hashes = { S-TDR2AXI-0013 = "63ae7c91436e", S-TDR2AXI-0019 = "068760d94671", S-TDR2AXI-0020 = "039ce450baa2", S-TDR2AXI-0024 = "db9e725ac4d1" }

[[constraint]]
id = "CFGC-ADDR-MIN-D64"
when = { CFG-AXI-DATA-WIDTH = "64" }
allow = { CFG-AXI-ADDR-WIDTH = ["3", "32", "48", "64"] }
atoms = ["S-TDR2AXI-0014", "S-TDR2AXI-0021"]
atom_hashes = { S-TDR2AXI-0014 = "b0d1597d458b", S-TDR2AXI-0021 = "8b0b7649cf7d" }

