version = "0.13.2 (2019-03-22, git d5029366d59e8563c08b6b9435f82573b603e48e)"
location = "https://riscv.org/wp-content/uploads/2019/03/riscv-debug-release.pdf; source https://github.com/riscv/riscv-debug-spec"
profile = { dm_version = "dmstatus.version = 2 (0.13); DV takes 0.13.2", dtm = "no JTAG DTM: no IDCODE, BYPASS or dtmcs; the dmi register layout sits on one external 41-bit TDR", abits = "7", dmi_ops = "0 nop, 1 read, 2 write, 3 clear sticky status (reserved in 0.13.2; replaces dtmcs.dmireset)", dmi_status = "0 success, 2 failed, 3 busy; failed and busy sticky until op 3", dmihardreset = "none", idle_hint = "none (no dtmcs.idle); the debugger raises Run-Test/Idle cycles after a busy status", harts = "1, always unavailable", abstract_commands = "none: every command sets cmderr = 2", authentication = "none", ndmreset = "not connected", dm_reset = "i_arst_n, or dmcontrol.dmactive = 0. While dmactive = 0 with a system-bus access in flight, sbcs, sbaddress and sbdata keep their values, sbcs.sbbusy reading 1, until the access completes, and then take their reset values (dm_csrs.sv:712-716); the access's data and error never land. The rest of the DM state resets at once, cmderr included (:689-709). During the hold a write of sbcs, sbaddress0, sbaddress1, sbdata0 or sbdata1 and a read of sbdata0 or sbdata1 are answered DMI busy (:393, :403, :512, :525, :535, :544, :554) and change nothing, sbbusyerror included, since the held registers take no update; reads of sbcs, sbaddress0 and sbaddress1 answer the held values (:382-390). DV takes the busy answer as the RTL reading and leaves it free, as Debug 1.0 lets any access fail while dmactive = 0. Set again in a cycle before the access's R or B handshake, the registers are not reset and the result lands in them (:717-728). A dmcontrol write the DM takes in the handshake's own cycle does neither: the hold branch drops the response, and on the next edge the active branch keeps the held values with sbbusy = 0 (:324-326, :618, :726-728), a boundary S-TDR2AXI-0091 leaves open. 0.13.2 3.12.2 resets DM state at once; documented by S-TDR2AXI-0090 and -0091", sba = "sbversion 1; sbasize = AXI_ADDR_WIDTH; sbaccess8, 16 and 32, plus sbaccess64 when AXI_DATA_WIDTH = 64; no 128-bit access", sba_registers = "sbcs, sbaddress0, sbaddress1 (sbasize > 32), sbdata0, sbdata1 (64-bit data)", sberror_codes = "2 on SLVERR or DECERR, 3 misaligned, 4 unsupported size; 1 and 7 never raised", departure_busy = "while sbbusy or sbbusyerror is set, a write of sbaddress0, sbaddress1, sbdata0 or sbdata1 or a read of sbdata0 or sbdata1 also answers DMI busy (dm_csrs.sv:393-395, 403-405, 525-527, 535-537, 544-546, 554-556), which the bridge keeps sticky until op 3 (dmi_tdr_bridge.sv:175-177, 229-230); 0.13.2 3.12.19, 3.12.20, 3.12.23 and 3.12.24 do nothing else; reads of sbaddress0 and sbaddress1 are never answered busy (dm_csrs.sv:385-390); an sbcs write while sbbusy is also answered busy (dm_csrs.sv:512-514), which 0.13.2 3.12.18 leaves undefined; documented by S-TDR2AXI-0043", departure_nop = "a nop update while an operation is pending sets sticky busy (dmi_tdr_bridge.sv:219-222, as dmi_jtag.sv:232-234), where 0.13.2 6.1.5 says a nop never causes busy or error; a nop in IDLE with a clear status sends nothing; documented by S-TDR2AXI-0043", departure_open = "while dmactive = 0 with no access in flight, sbcs reads 0x00040000: sbversion, sbasize and the sbaccess size bits read 0, since the fixed fields reach sbcs only while dmactive = 1 (dm_csrs.sv:617-624, :713), where 0.13.2 3.12.2 and 3.12.18 give them their fixed values; the document does not state it (S-TDR2AXI-0064)", sbdata0_read_increment = "an sbdata0 read increments sbaddress only after the read sbreadondata starts, and only if that read succeeded, as Debug 1.0 states for sbdata0 and S-TDR2AXI-0094 adopts (dm_sba.sv:138, :161); 0.13.2 3.12.23 step 4 reads as an increment on every sbdata0 read, with no success condition", enforcement = "feature: the DM and the DMI end of the DTM are inside the DUT, so their register semantics are checked by DUT features through the reference model, not by an interface VIP", departure_absent = "the absent sbaddress1 collides like a present register, and sbdata1 is not absent: at sbasize 32 or less sbaddress1 reads 0 (dm_csrs.sv:325, :389), but a write of it while sbbusy or sbbusyerror is set answers DMI busy and sets sbbusyerror (:533-537), as the present register does; at AXI_DATA_WIDTH 32, where 0.13.2 3.12.24 has no sbdata1, a write of it is stored and read back (:558, :407) until a bus read zero-extends sbdata (:582), and an access of it while sbbusy or sbbusyerror is set answers busy and sets sbbusyerror (:401-405, :552-556); 0.13.2 3.12 has an absent register read 0 and writing it have no effect. The document states neither (S-TDR2AXI-0014)" }

