[[timing]]
id = "T-TDR2AXI-resp-to-tdr"
kind = "latency"
clock = "CLK-TCK"
start = "The DM's DMI response is handed to the response CDC: the i_clk rising edge with dm_csrs dmi_resp_valid and u_cdc_resp ready, one i_clk cycle after the DM accepts the request. The system-bus (AXI) access an operation starts is not on this path."
