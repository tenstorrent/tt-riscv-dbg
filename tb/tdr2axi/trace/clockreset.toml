schema_version = 1
dut = "tdr2axi"

[[clock]]
id = "CLK-BUS"
ports = ["i_clk"]
relation = "asynchronous to CLK-TCK; any ratio (S-TDR2AXI-0048). The spec states no frequency or ratio range."
gating = "The spec states no gating. An operation crosses into the DM, and both CDCs finish their post-reset clear sequence (T-TDR2AXI-cdc-clear-20to1, T-TDR2AXI-cdc-clear-20to19, T-TDR2AXI-cdc-clear-20to21, T-TDR2AXI-cdc-clear-1to2, T-TDR2AXI-cdc-clear-1to20), only while i_clk runs; with i_clk stopped an operation stays pending and the TCK side reports busy (S-TDR2AXI-0043)."
mode = "functional"
atoms = ["S-TDR2AXI-0025", "S-TDR2AXI-0043", "S-TDR2AXI-0048", "S-TDR2AXI-0088"]
atom_hashes = { S-TDR2AXI-0025 = "f9c0b3f52cb9", S-TDR2AXI-0043 = "8e6844992030", S-TDR2AXI-0048 = "719d2a15043e", S-TDR2AXI-0088 = "585e71f1dacf" }

[[clock]]
id = "CLK-TCK"
ports = ["i_tck"]
relation = "asynchronous to CLK-BUS; the two crossings are valid/ready handshakes, so correctness does not depend on the i_clk / TCK ratio (S-TDR2AXI-0048). The spec states no frequency or ratio range."
gating = "TCK runs only during scans and stops between them (S-TDR2AXI-0049), and is stopped whenever TRST changes (S-TDR2AXI-0055). While it is stopped the TCK-side state holds and a DMI response waits in the response CDC; it reaches o_dmi_tdr only as TCK edges arrive (T-TDR2AXI-resp-to-tdr, T-TDR2AXI-resp-to-tdr-ss4). The post-reset clear sequence of both CDCs also advances only on TCK edges (T-TDR2AXI-cdc-clear-20to1, T-TDR2AXI-cdc-clear-20to19, T-TDR2AXI-cdc-clear-20to21, T-TDR2AXI-cdc-clear-1to2, T-TDR2AXI-cdc-clear-1to20)."
mode = "functional"
atoms = ["S-TDR2AXI-0029", "S-TDR2AXI-0048", "S-TDR2AXI-0049", "S-TDR2AXI-0055", "S-TDR2AXI-0088"]
atom_hashes = { S-TDR2AXI-0029 = "25fa2b2bc2ad", S-TDR2AXI-0048 = "719d2a15043e", S-TDR2AXI-0049 = "a21af701e756", S-TDR2AXI-0055 = "c43a965a03de", S-TDR2AXI-0088 = "585e71f1dacf" }

[[reset]]
id = "RST-ARST-BUS"
polarity = "low"
assertion = "async"
deassertion = "sync"
ports = ["i_arst_n"]
signals = ["arst_clk_n"]
clock = "CLK-BUS"
sequence = "Same i_arst_n as RST-ARST-TCK (S-TDR2AXI-0051): asserted at once and released synchronously (S-TDR2AXI-0052) through SYNC_STAGES i_clk flops (S-TDR2AXI-0018), SYNC_STAGES i_clk rising edges after i_arst_n rises, plus one when the release lands in the first synchronizer flop's sampling window, so i_clk must run after the release. If i_arst_n is a system reset it must also reset the fabric tdr2axi accesses, so an outstanding AXI transaction never survives on one side only (S-TDR2AXI-0057). It is never TRST (S-TDR2AXI-0026)."
scope = "i_clk side: dm_csrs (every DM register, dmcontrol.dmactive included, and the DMI response queue), dm_sba, the AXI or AXI4-Lite adapter with any transaction in flight, and the i_clk halves of both CDCs. The software clears are separate: RST-DMACTIVE clears dm_csrs, and op 3 clears the bridge status."
mode = "functional"
atoms = ["S-TDR2AXI-0018", "S-TDR2AXI-0026", "S-TDR2AXI-0051", "S-TDR2AXI-0052", "S-TDR2AXI-0057"]
atom_hashes = { S-TDR2AXI-0018 = "d0a75c21b626", S-TDR2AXI-0026 = "122754e00bef", S-TDR2AXI-0051 = "56b178b0aa12", S-TDR2AXI-0052 = "a2c835cc4ea4", S-TDR2AXI-0057 = "b7b90795c926" }

[[reset]]
id = "RST-ARST-TCK"
polarity = "low"
assertion = "async"
deassertion = "sync"
ports = ["i_arst_n"]
signals = ["arst_tck_n"]
clock = "CLK-TCK"
sequence = "i_arst_n may assert and release at any time, fully asynchronously (S-TDR2AXI-0051). It asserts the TCK side at once and releases it synchronously (S-TDR2AXI-0052) through SYNC_STAGES TCK flops (S-TDR2AXI-0018), SYNC_STAGES TCK rising edges after i_arst_n rises (S-TDR2AXI-0053; T-TDR2AXI-tck-reset-release at SYNC_STAGES = 3, T-TDR2AXI-tck-reset-release-ss4 at 4), so TCK must run after the release. Asserted together with RST-ARST-BUS and released independently of it. Once both are released, both CDCs run their clear sequence, which needs TCK and i_clk edges before the first operation can cross (T-TDR2AXI-cdc-clear-20to1, T-TDR2AXI-cdc-clear-20to19, T-TDR2AXI-cdc-clear-20to21, T-TDR2AXI-cdc-clear-1to2, T-TDR2AXI-cdc-clear-1to20). TRST does not reset this domain (S-TDR2AXI-0054)."
scope = "TCK side of the bridge: the dmi_tdr_bridge FSM state, the captured address and data registers, the sticky busy/failed status, and the TCK halves of both CDCs. Not reset: the CDC payload registers (no reset, only sampled after a request toggle) and the external TDR cell. The capture after release reads address 0, data 0, status ok."
mode = "functional"
atoms = ["S-TDR2AXI-0018", "S-TDR2AXI-0026", "S-TDR2AXI-0051", "S-TDR2AXI-0052", "S-TDR2AXI-0053", "S-TDR2AXI-0054"]
atom_hashes = { S-TDR2AXI-0018 = "d0a75c21b626", S-TDR2AXI-0026 = "122754e00bef", S-TDR2AXI-0051 = "56b178b0aa12", S-TDR2AXI-0052 = "a2c835cc4ea4", S-TDR2AXI-0053 = "d81fd3f0d3cd", S-TDR2AXI-0054 = "527763ed1ef2" }

[[reset]]
id = "RST-DMACTIVE"
polarity = "low"
assertion = "sync"
deassertion = "sync"
signals = ["u_dm_csrs.dmcontrol_q.dmactive (dm_csrs dmactive_o)"]
clock = "CLK-BUS"
sequence = "Software asserts it with a DMI write of dmcontrol (address 0x10) with dmactive = 0 and releases it with a write of dmactive = 1 (S-TDR2AXI-0056, -0064), each an operation through the TDR, so only while RST-ARST-TCK and RST-ARST-BUS are released and the CDC clear sequence has ended. dmactive changes at the i_clk edge where dm_csrs takes the write; from the next edge dm_csrs holds the registers in its scope at their reset values for as long as dmactive = 0, and dmactive is the only field a write changes then (src/dm_csrs.sv:688-716). With a system-bus access in flight, sbcs, sbaddress and sbdata keep their values, sbcs.sbbusy reading 1, until the access completes and reset on the edge after it (S-TDR2AXI-0090, src/dm_csrs.sv:712-716); a release the DM takes in a cycle before the access's R or B handshake leaves them unreset and the access's result lands in them (S-TDR2AXI-0091). A release taken in the handshake's own cycle does neither: the response is dropped and the held values stay, with sbbusy reading 0 (src/dm_csrs.sv:712-716, :726-728), a boundary S-TDR2AXI-0091 leaves open."
scope = "dm_csrs: dmcontrol except dmactive, cmderr, command, abstractauto, progbuf, data and the pending resume request (src/dm_csrs.sv:688-711), and sbcs (back to its reset value, sbaccess = 2), sbaddress and sbdata once no system-bus access is in flight (:712-716); dm_sba, which starts no access from Idle while dmactive = 0 (src/dm_sba.sv:128, S-TDR2AXI-0089). Untouched: havereset, which updates outside that branch (src/dm_csrs.sv:686); the DMI response queue, whose flush input is tied off (src/tdr2axi/tdr2axi.sv:150); an access dm_sba already started, which completes on the bus with the payload it started with (S-TDR2AXI-0090), and the AXI or AXI4-Lite adapter with any transaction it has open, which only i_arst_n clears (S-TDR2AXI-0092); both CDCs; and the whole TCK side, whose sticky status only op 3 or i_arst_n clears."
mode = "functional"
atoms = ["S-TDR2AXI-0056", "S-TDR2AXI-0064", "S-TDR2AXI-0089", "S-TDR2AXI-0090", "S-TDR2AXI-0091", "S-TDR2AXI-0092"]
atom_hashes = { S-TDR2AXI-0056 = "1dc45f92f42b", S-TDR2AXI-0064 = "602666509c6e", S-TDR2AXI-0089 = "aebf43d1fc8f", S-TDR2AXI-0090 = "e2a63e08b288", S-TDR2AXI-0091 = "7839c154d0e4", S-TDR2AXI-0092 = "08b1c287817d" }

