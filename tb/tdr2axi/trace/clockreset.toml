[[crossing]]
id = "RDC-ARST"
kind = "rdc"
source = "RST-ARST-TCK"
dest = "RST-ARST-BUS"
signals = ["async_req, async_ack and async_data of u_cdc_req and u_cdc_resp, whose halves sit in the two reset domains and leave reset at different times", "async_a2b_req, async_a2b_ack, async_a2b_next_phase, async_b2a_req, async_b2a_ack and async_b2a_next_phase of i_cdc_reset_ctrlr in u_cdc_req and u_cdc_resp: the reset controller's own four-phase crossings (cdc_4phase_src and cdc_4phase_dst with 2-flop synchronizers, cdc_reset_ctrlr.sv:138-183, :389-436), whose halves also sit in the two reset domains"]
sync = "cdc_reset_ctrlr in each cdc_2phase_clearable (CLEAR_ON_ASYNC_RESET = 1): an asynchronous reset of either side starts an isolate and clear sequence mirrored on the other side through the controller's four-phase crossings. Their source halves put the ISOLATE phase on the crossing while still in reset (SEND_RESET_MSG = 1, cdc_reset_ctrlr.sv:395-397), and they run non-decoupled, so a phase advances only after the other side acknowledges it (T-TDR2AXI-cdc-clear-20to1, T-TDR2AXI-cdc-clear-20to19, T-TDR2AXI-cdc-clear-20to21, T-TDR2AXI-cdc-clear-1to2, T-TDR2AXI-cdc-clear-1to20)."
atoms = ["S-TDR2AXI-0051", "S-TDR2AXI-0052"]
atom_hashes = { S-TDR2AXI-0051 = "56b178b0aa12", S-TDR2AXI-0052 = "a2c835cc4ea4" }

[[timing]]
id = "T-TDR2AXI-cdc-clear-1to2"
kind = "latency"
clock = "CLK-TCK"
start = "CFG-CLK-RATIO = 1:2 (T_clk / T_tck = 2), both clocks running, i_test_mode = 0, any SYNC_STAGES. The later of the two synchronized releases after i_arst_n rises: arst_tck_n (T-TDR2AXI-tck-reset-release) or arst_clk_n, SYNC_STAGES i_clk edges after i_arst_n, plus one when the release lands in the first synchronizer flop's sampling window."
end = "All four isolate requests are low (s_src_isolate_req and s_dst_isolate_req of u_cdc_req and u_cdc_resp), so both CDCs pass valid and ready again and the first operation crosses without busy. Counted in TCK rising edges after the start: at most 79. Derivation: each cdc_reset_ctrlr half leaves reset in ISOLATE (cdc_reset_ctrlr.sv:371-378) and steps through the ISOLATE, CLEAR, POST_CLEAR and IDLE phases, each a non-decoupled four-phase handshake through 2-flop synchronizers (cdc_reset_ctrlr.sv:389-436, cdc_4phase.sv:130-170, :244-282). A handshake costs at most 4 receiver, 3 sender, 3 receiver and 3 sender edges, plus one sender edge to raise the next request; the first request is up from reset (SEND_RESET_MSG = 1). A side's sequence therefore ends within 27 edges of one clock and 28 of the other, so ceil(27 x (1 + T_clk / T_tck) + max(1, T_clk / T_tck)) = 83 bounds it from above. An edge model that replays these counts for both initiators, each toggle taken by the first receiving edge strictly after it, over i_clk phase and release time, gives 79 as the exact maximum at SYNC_STAGES 3 and 4 alike. No synchronizer on this path depends on SYNC_STAGES. Across i_clk phase and release time the window spans 73 to 79 TCK edges at SYNC_STAGES 3 and 4; 79 needs coincident i_clk and TCK rising edges."
max_cycles = 79
basis = "dv-reading"
atoms = ["S-TDR2AXI-0052", "S-TDR2AXI-0053", "S-TDR2AXI-0088"]
atom_hashes = { S-TDR2AXI-0052 = "a2c835cc4ea4", S-TDR2AXI-0053 = "d81fd3f0d3cd", S-TDR2AXI-0088 = "585e71f1dacf" }

