polarity = "low"
assertion = "async"
deassertion = "async"
signals = ["TRST of the environment TAP (not a tdr2axi port)"]
sequence = "Asserted and released only while TCK is stopped (S-TDR2AXI-0055)."
scope = "Nothing in tdr2axi (S-TDR2AXI-0054): an operation in flight when TRST asserts completes normally (S-TDR2AXI-0055), and the sticky status survives until op 3."
