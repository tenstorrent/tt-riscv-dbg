kind = "latency"
clock = "CLK-TCK"
start = "CFG-SYNC-STAGES = 3 and CFG-CLK-RATIO = 1:2 (T_clk / T_tck = 2), TCK running. The TCK rising edge that samples i_dmi_tdr_update with op 1 or 2, the bridge FSM in IDLE and the sticky status clear: the Update-DR of an operation scan."
end = "The bridge FSM is back in IDLE with o_dmi_tdr holding the DMI response, so a Capture-DR or Update-DR on any later TCK rising edge raises no busy. Counted in TCK rising edges after the start: at least SYNC_STAGES + 3 + floor((SYNC_STAGES + 2) x T_clk / T_tck) = 16 and at most SYNC_STAGES + 3 + floor((SYNC_STAGES + 3) x T_clk / T_tck) = 18. The next TCK edge launches the request (src/tdr2axi/dmi_tdr_bridge.sv:158-163), SYNC_STAGES + 3 i_clk edges carry it through the request CDC and the DM into the response CDC (src/dm_csrs.sv:198-200), and SYNC_STAGES + 2 TCK edges bring it to o_dmi_tdr; each synchronizer takes a toggle on the first edge strictly after it. The response toggle therefore leaves more than (SYNC_STAGES + 2) x T_clk and at most (SYNC_STAGES + 3) x T_clk after the launch edge, and the count is SYNC_STAGES + 3 plus the TCK edges in that span. The span is longest when an i_clk edge coincides with the launch edge, since that i_clk edge does not take the toggle launched on it; if the span is then a whole number of TCK periods, the response toggle lands on a TCK edge that does not take it either, and that edge adds one to the count. (SYNC_STAGES + 3) x T_clk / T_tck = 12 is a whole number, so the maximum occurs only with coincident edges and is one above SYNC_STAGES + 2 + ceil((SYNC_STAGES + 3) x T_clk / T_tck) = 17. The maximum is the count a host's Run-Test/Idle wait after the operation scan must cover; the AXI access the operation starts is not on this path. Across i_clk phase and release time the window spans 16 to 18 TCK edges."
