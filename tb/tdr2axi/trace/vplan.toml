schema_version = 1
dut = "tdr2axi"

[[check]]
id = "CHK-AXI-AXI4-SIZE"
kind = "scoreboard"
atoms = ["S-TDR2AXI-0059"]
feature = "F-AXI-axi4-size"
compare = "in-order"
intent = "On AXI4, each AR and AW carries AxSIZE equal to the access's sbaccess and its address, and a write's WSTRB marks only the accessed bytes"
applies = { USE_AXI_LITE = ["0"] }
atom_hashes = { S-TDR2AXI-0059 = "24988ecd1470" }

[[check]]
id = "CHK-AXI-AXI4-SIZE-SVA"
kind = "assertion"
atoms = ["S-TDR2AXI-0059"]
feature = "F-AXI-axi4-size"
intent = "On AXI4, while ARVALID or AWVALID is high, AxSIZE equals sbcs.sbaccess of the access, whatever AXI_DATA_WIDTH is"
applies = { USE_AXI_LITE = ["0"] }
atom_hashes = { S-TDR2AXI-0059 = "24988ecd1470" }

[[check]]
id = "CHK-AXI-HANDSHAKE-SVA"
kind = "assertion"
atoms = ["S-TDR2AXI-0001", "S-TDR2AXI-0013", "S-TDR2AXI-0034", "S-TDR2AXI-0035"]
feature = "F-AXI-manager-protocol"
intent = "On o_axi_req, AR, AW and W VALID stay high until READY, every request field holds while VALID is high and READY low, R and B complete only with RREADY and BREADY, and no VALID is high in reset, in the AXI4 or AXI4-Lite form USE_AXI_LITE selects"
atom_hashes = { S-TDR2AXI-0001 = "71535400dccd", S-TDR2AXI-0013 = "63ae7c91436e", S-TDR2AXI-0034 = "91256593195c", S-TDR2AXI-0035 = "76db3e8aaeed" }

[[check]]
id = "CHK-AXI-LITE-FULL-WIDTH"
kind = "scoreboard"
atoms = ["S-TDR2AXI-0013", "S-TDR2AXI-0015", "X-AXI4_LITE-full-width"]
feature = "F-AXI-lite-full-width"
compare = "in-order"
intent = "On AXI4-Lite, a narrow write is one full-width beat whose WSTRB marks its bytes, and a narrow read takes its bytes from the addressed lanes of the whole word returned"
applies = { USE_AXI_LITE = ["1"] }
atom_hashes = { S-TDR2AXI-0013 = "63ae7c91436e", S-TDR2AXI-0015 = "3abbe99ca471" }

[[check]]
id = "CHK-AXI-NO-COMB-PATH"
kind = "checker"
atoms = ["S-TDR2AXI-0034", "S-TDR2AXI-0035", "X-AXI4-no-comb-path", "X-AXI4_LITE-no-comb-path"]
feature = "F-AXI-no-comb-path"
intent = "With i_axi_rsp changing between i_clk edges, o_axi_req changes only at i_clk rising edges"
atom_hashes = { S-TDR2AXI-0034 = "91256593195c", S-TDR2AXI-0035 = "76db3e8aaeed" }

[[check]]
id = "CHK-AXI-NO-COMB-PATH-SVA"
kind = "assertion"
atoms = ["S-TDR2AXI-0034", "S-TDR2AXI-0035", "X-AXI4-no-comb-path", "X-AXI4_LITE-no-comb-path"]
feature = "F-AXI-no-comb-path"
intent = "In a model where i_axi_rsp may change on any global tick, o_axi_req is stable on every tick that is not an i_clk rising edge"
atom_hashes = { S-TDR2AXI-0034 = "91256593195c", S-TDR2AXI-0035 = "76db3e8aaeed" }

[[check]]
id = "CHK-AXI-ONE-OUTSTANDING"
kind = "checker"
atoms = ["S-TDR2AXI-0012", "S-TDR2AXI-0058"]
feature = "F-AXI-one-outstanding"
intent = "At most one AR or AW is accepted without its R or B, the next request follows the previous response, and each transaction is one beat: AxLEN 0, WLAST on the W beat, AxBURST legal for one beat"
atom_hashes = { S-TDR2AXI-0012 = "aa0b80647438", S-TDR2AXI-0058 = "b5989e954e15" }

[[check]]
id = "CHK-AXI-ONE-OUTSTANDING-SVA"
kind = "assertion"
atoms = ["S-TDR2AXI-0012", "S-TDR2AXI-0058"]
feature = "F-AXI-one-outstanding"
intent = "No AR or AW handshake while a read or write response is owed, AxLEN 0 and WLAST high on every W beat"
atom_hashes = { S-TDR2AXI-0012 = "aa0b80647438", S-TDR2AXI-0058 = "b5989e954e15" }

[[check]]
id = "CHK-AXI-REQ-ATTRS"
kind = "checker"
atoms = ["S-TDR2AXI-0016", "S-TDR2AXI-0017", "S-TDR2AXI-0058", "X-AXI4-prot-encoding", "X-AXI4_LITE-prot-encoding", "X-AXI4-id-user-values"]
feature = "F-AXI-request-attributes"
intent = "Every AR and AW carries AxPROT = AXI_PROT and, on AXI4, AxCACHE = AXI_CACHE, AxID 0 and AxUSER 0, and every W carries WUSER 0, against the build's parameter values"
atom_hashes = { S-TDR2AXI-0016 = "18fce41befde", S-TDR2AXI-0017 = "8462fa5a51c6", S-TDR2AXI-0058 = "b5989e954e15" }

[[check]]
id = "CHK-AXI-REQ-ATTRS-SVA"
kind = "assertion"
atoms = ["S-TDR2AXI-0016", "S-TDR2AXI-0017", "S-TDR2AXI-0058", "X-AXI4-prot-encoding", "X-AXI4_LITE-prot-encoding", "X-AXI4-id-user-values"]
feature = "F-AXI-request-attributes"
intent = "While ARVALID or AWVALID is high, AxPROT equals AXI_PROT, AxCACHE equals AXI_CACHE on AXI4, and AxID, AxUSER and WUSER are 0"
atom_hashes = { S-TDR2AXI-0016 = "18fce41befde", S-TDR2AXI-0017 = "8462fa5a51c6", S-TDR2AXI-0058 = "b5989e954e15" }

[[check]]
id = "CHK-AXISUB-BOUNDARY-4K"
kind = "vip"
atoms = ["X-AXI4-boundary-4k"]
intent = "No burst crosses a 4KB address boundary"
applies = { USE_AXI_LITE = ["0"] }

[[check]]
id = "CHK-AXISUB-BURST-LENGTH"
kind = "vip"
atoms = ["X-AXI4-burst-length"]
intent = "AxLEN is legal for AxBURST: INCR 1 to 256 beats, FIXED 1 to 16, WRAP 2, 4, 8 or 16 from an aligned start"
applies = { USE_AXI_LITE = ["0"] }

[[check]]
id = "CHK-AXISUB-CACHE-LEGAL"
kind = "vip"
atoms = ["X-AXI4-cache-legal"]
