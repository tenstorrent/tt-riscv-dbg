applies = { USE_AXI_LITE = ["0"] }

[[check]]
id = "CHK-AXISUB-ID-ORDER"
kind = "vip"
atoms = ["X-AXI4-id-order"]
intent = "Each response carries its request's ID, and responses to one ID return in issue order"
applies = { USE_AXI_LITE = ["0"] }

[[check]]
id = "CHK-AXISUB-LAST-BEAT"
kind = "vip"
atoms = ["X-AXI4-last-beat"]
intent = "WLAST is high on the final W beat of each write"
applies = { USE_AXI_LITE = ["0"] }

[[check]]
id = "CHK-AXISUB-PAYLOAD-STABLE"
kind = "vip"
atoms = ["X-AXI4-payload-stable", "X-AXI4_LITE-payload-stable"]
intent = "Every request field of AR, AW and W holds from VALID until the handshake"

[[check]]
id = "CHK-AXISUB-READ-RESP-ORDER"
kind = "vip"
atoms = ["X-AXI4-read-data-after-address", "X-AXI4_LITE-read-data-after-address"]
intent = "RVALID rises only after the AR handshake of the read it answers"

[[check]]
id = "CHK-AXISUB-RESET-VALID-LOW"
kind = "vip"
atoms = ["X-AXI4-reset-valid-low", "X-AXI4_LITE-reset-valid-low"]
intent = "No VALID is high in reset or before the first i_clk rising edge after release"

[[check]]
id = "CHK-AXISUB-SIZE-WIDTH"
kind = "vip"
atoms = ["X-AXI4-size-width"]
intent = "AxSIZE never exceeds the data bus width"
applies = { USE_AXI_LITE = ["0"] }

[[check]]
id = "CHK-AXISUB-STROBE-LANES"
kind = "vip"
atoms = ["X-AXI4-strobe-lanes", "X-AXI4_LITE-strobe-lanes"]
intent = "WSTRB is high only on lanes the address and size select"

[[check]]
id = "CHK-AXISUB-VALID-HELD"
kind = "vip"
atoms = ["X-AXI4-valid-held", "X-AXI4_LITE-valid-held"]
intent = "ARVALID, AWVALID and WVALID stay high from assertion until the READY handshake"

[[check]]
id = "CHK-AXISUB-VALID-INDEPENDENT"
kind = "vip"
atoms = ["X-AXI4-valid-independent", "X-AXI4_LITE-valid-independent"]
intent = "With READY held low until VALID rises, every VALID still rises: no VALID waits for READY"

[[check]]
id = "CHK-AXISUB-WRITE-RESP-ORDER"
kind = "vip"
atoms = ["X-AXI4-write-response-after-data", "X-AXI4_LITE-write-response-after-data"]
intent = "BVALID rises only after the AW handshake and the last W handshake of that write"

[[check]]
