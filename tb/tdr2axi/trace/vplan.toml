kind = "scoreboard"
atoms = ["S-TDR2AXI-0091"]
feature = "F-DM-dmactive-inflight"
compare = "state"
intent = "dmactive set again by a dmcontrol write the DM takes in a cycle before the access's R or B handshake, whether the access waits for READY or for its R or B response, resets none of sbcs, sbaddress and sbdata, and the access's result lands in them: sbbusy falls at the response, sbdata0 reads the read data, sberror reads 2 after SLVERR or DECERR, and with sbautoincrement set sbaddress advances only after a successful access. A write taken in the handshake's own cycle neither resets them nor lands the result, a boundary S-TDR2AXI-0091 leaves open, and the check grades no re-arm in that cycle"
