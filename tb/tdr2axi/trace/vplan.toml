[[check]]
id = "CHK-DM-DMACTIVE-ALONE"
kind = "checker"
atoms = ["S-TDR2AXI-0056", "S-TDR2AXI-0064"]
feature = "F-DM-dmactive-clear"
intent = "dmactive cleared and set again with no other reset, no system-bus access in flight and none started while it is 0 issues no AR or AW, leaves the subordinate memory unchanged and the bridge status 0, and each capture holds the result of the operation it follows: dmcontrol reads dmactive = 0 while cleared, then 1, and sbcs reads its reset value after the set"
atom_hashes = { S-TDR2AXI-0056 = "1dc45f92f42b", S-TDR2AXI-0064 = "602666509c6e" }

[[check]]
id = "CHK-DM-DMACTIVE-CLEAR"
kind = "scoreboard"
atoms = ["S-TDR2AXI-0056", "S-TDR2AXI-0064", "X-RISCV_DEBUG-dmactive"]
feature = "F-DM-dmactive-clear"
compare = "state"
intent = "While dmactive = 0, whether a dmcontrol write or i_arst_n cleared it, abstractcs reads cmderr = 0 whatever was written before, whether or not a system-bus access is in flight; after i_arst_n, or after a dmcontrol write of dmactive = 0 that found no system-bus access in flight, sbaddress0, sbaddress1, sbdata0 and sbdata1 read their reset values while dmactive = 0 whatever was written before, with sbcs compared only in sbbusy and sbbusyerror, which read 0, sbbusyerror also when it was set before dmactive fell, and sbcs reads its reset value once dmactive = 1; after dmactive = 1, cmderr reads 0 when a dmcontrol write cleared dmactive, and when that write found no system-bus access in flight, sbaddress0, sbaddress1, sbdata0 and sbdata1 read their reset values and accesses work"
atom_hashes = { S-TDR2AXI-0056 = "1dc45f92f42b", S-TDR2AXI-0064 = "602666509c6e" }

[[check]]
id = "CHK-DM-DMACTIVE-INFLIGHT"
kind = "checker"
atoms = ["S-TDR2AXI-0056", "S-TDR2AXI-0090"]
feature = "F-DM-dmactive-inflight"
intent = "An access stalled on AR, AW or W when dmactive drops keeps its address, size, data and strobes until its handshake, and completes once"
atom_hashes = { S-TDR2AXI-0056 = "1dc45f92f42b", S-TDR2AXI-0090 = "e2a63e08b288" }

[[check]]
id = "CHK-DM-DMACTIVE-INFLIGHT-HOLD"
kind = "scoreboard"
atoms = ["S-TDR2AXI-0090"]
feature = "F-DM-dmactive-inflight"
compare = "state"
intent = "While dmactive = 0 holds an access in flight, sbcs reads the value it had when dmactive fell, with sbbusy = 1 and sbbusyerror as it was then, 1 after a collision before the fall, and sbaddress0 and sbaddress1 the access's address; a write of sbcs, sbaddress0, sbaddress1, sbdata0 or sbdata1 or a read of sbdata0 or sbdata1 during the hold changes none of them and leaves sbbusyerror as it was, an sbcs write of 1 to sbbusyerror included, whatever the DMI answer; once sbcs reads sbbusy = 0, with dmactive still 0, it reads sbbusyerror = 0 with it, and sbaddress0, sbaddress1, sbdata0 and sbdata1 read their reset values; after dmactive is set again sbcs, sbaddress0, sbaddress1, sbdata0 and sbdata1 read their reset values, sbbusyerror = 0 included, with no trace of the access's read data or error response"
atom_hashes = { S-TDR2AXI-0090 = "e2a63e08b288" }

