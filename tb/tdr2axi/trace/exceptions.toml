[[exception]]
id = "EXC-XFAIL-DMACTIVE-INFLIGHT"
kind = "expected-fail"
target = "tdr2axi_dmactive_inflight_test"
reason = "dm_sba never reads dmactive_i (src/dm_sba.sv:26) and dm_csrs clears sbcs, sbaddress and sbdata while dmactive = 0 (src/dm_csrs.sv:688, :710-712), so an access stalled on AR, AW or W when dmactive falls changes its payload to the cleared values before READY. Verilator pin: CHK-DM-DMACTIVE-INFLIGHT FAIL, logged before the release, naming a change to addr 0x0 size 2 (AXI4) or size 0 (AXI-Lite), or to data 0x0 strb 0xf; allowed beside it, never alone: AxiSub's CHK-AXISUB-PAYLOAD-STABLE FAIL to the same cleared payload and the bench SVA's CHK-AXI-HANDSHAKE-SVA payload line. VCS pin: axi_lite_from_mem's $fatal that mem_addr_i, mem_wdata_i or mem_be_i has to be stable if request is not granted, with cocotb's shutdown records after it."
issue = "dm_sba keeps an access in flight after dmactive falls, and its payload changes before READY"
approved = true

[[exception]]
id = "EXC-XFAIL-DMACTIVE-NO-BUS"
kind = "expected-fail"
target = "tdr2axi_dmactive_no_bus_test"
reason = "dm_sba never reads dmactive_i (src/dm_sba.sv:26), so an sbdata0 write while dmactive = 0 starts a write at the cleared address 0 (src/dm_sba.sv:127, src/dm_csrs.sv:542-551). Pin: CHK-DM-DMACTIVE-NO-BUS FAIL on the sbdata0 write raising AWVALID."
issue = "dm_sba starts a bus write on an sbdata0 write while dmactive = 0"
approved = true

[[exception]]
id = "EXC-XFAIL-SBA-NO-INC-AFTER-ERROR"
kind = "expected-fail"
target = "tdr2axi_sba_error_address_test"
reason = "dm_sba sets the address increment from sbautoincrement whether or not the bus returned an error (src/dm_sba.sv:149, :166) and dm_csrs copies it back (src/dm_csrs.sv:325), so after SLVERR or DECERR sbaddress has moved past the failing word, against RISC-V Debug 0.13.2 3.12.19 and 3.12.23. Pin: CHK-SBA-NO-INC-AFTER-ERROR FAIL; allowed beside it, never alone: CHK-TDR-CAPTURE-EDGE FAIL on the capture of the sbaddress0 read that shows the moved address."
issue = "sbaddress advances past a word whose access returns SLVERR or DECERR"
approved = true
