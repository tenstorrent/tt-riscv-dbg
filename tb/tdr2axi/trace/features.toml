[[disposition]]
atom = "S-TDR2AXI-0044"
disposition = "issue"
reason = "Unreachable in tdr2axi, so no test can hit it: dm_csrs answers every DMI request with success or busy (src/dm_csrs.sv:328-329, :395, :514) and nothing in src/ answers DTM_ERR, so status 2 and the 0xDEADBEEF and 0xBAADC0DE markers never reach o_dmi_tdr. Draft 3 of tdr2axi_spec_issues.md ('Whether the status can be failed at all') asks the designer whether failed is meant to be reachable or the document should say it does not occur. F-TDR-sticky-busy checks DV's reading at o_dmi_tdr: the captured status never reads 2. Under D6 the bridge's failed-status branches (src/tdr2axi/dmi_tdr_bridge.sv:171-174, :197-199, :233-235, the failed arm of :265-266), and the reserved-response arm that loads 0xBAADC0DE (:179-181), leave code coverage only behind a SymbiYosys unreachability proof that error_q never holds the failed value and dm_csrs never answers an error or reserved code, owned by dv-cov-closure-fv-sby."
approved = true
hash = "d3814c86a0e3"

