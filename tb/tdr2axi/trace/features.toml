title = "On AXI4-Lite every transfer is one full-width beat: a narrow write marks its bytes with WSTRB and a narrow read takes its bytes from the whole word"
priority = "P1"
method = ["sim", "vip"]
observe = "WSTRB and WDATA lanes of o_axi_req and RDATA lanes of i_axi_rsp against sbdata, per access size and offset"
